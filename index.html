<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外婆的时光相册</title>
<link rel="stylesheet" href="album.css">
<script src="photos.js" defer></script>
<script src="album.js" defer></script>
</head>
<body>
<div id="page">
<header id="cover">
  <p class="eyebrow">献给我们最爱的外婆 · 黎桂华</p>
  <h1>时光相册</h1>
  <p class="intro">一家人的日子，一张张慢慢看</p>
  <p id="albumMeta">2004 — 2026</p>
  <div class="cover-actions">
    <button class="primary" id="startBtn">打开相册</button>
    <button id="resumeCover" hidden>接着上次看</button>
  </div>
  <p class="hint">点照片看大图，文字和按钮一直都在</p>
</header>
<main id="album" hidden>
  <header class="album-heading"><h1 tabindex="-1" id="albumHeading">外婆的时光相册</h1><p>点一张照片，就能放大看</p></header>
  <nav class="toolbar" aria-label="相册工具">
    <label for="yearSelect">看哪一年</label>
    <select id="yearSelect" aria-label="选择年份"></select>
    <button id="jumpYear">去看看</button>
    <button id="resumeAlbum" hidden>接着上次看</button>
    <button class="music" aria-pressed="false">播放音乐</button>
  </nav>
  <p id="musicStatus" class="status" role="status"></p>
  <div id="timeline"></div>
  <footer><p>愿时光温柔以待，把每一个笑容都收好</p><a href="#albumHeading">回到相册开头</a><p class="credit">背景音乐：Meditation Impromptu 03<br>Kevin MacLeod（incompetech.com）<br><a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0 授权</a></p></footer>
</main>
<noscript><p class="noscript">相册需要开启浏览器的 JavaScript 才能显示照片。请在浏览器设置中开启后刷新。</p></noscript>
</div>
<dialog id="viewer" aria-labelledby="vtitle" aria-describedby="vwhen">
  <div class="viewer-layout">
    <header class="viewer-toolbar"><button id="vclose" autofocus>返回相册</button><p id="vcount" aria-live="polite"></p><button class="music" aria-pressed="false">播放音乐</button></header>
    <div id="stage"><img id="vimg" alt=""><div id="imageFeedback" role="status"><p id="imageStatus"></p><button id="retryImage" hidden>重新加载</button></div></div>
    <section id="vbar"><p id="vwhen"></p><h2 id="vtitle"></h2><p id="vdesc"></p>
      <div class="photo-tools"><button id="zoomBtn" aria-pressed="false">放大照片</button><a id="vsave" class="button" download>下载照片</a><a id="original" class="button" target="_blank" rel="noopener">打开原图</a></div>
      <p class="save-hint">下载后请在浏览器的下载记录里查找。手机也可打开原图，长按图片选择保存。</p>
      <p id="saveStatus" role="status"></p>
    </section>
    <nav class="viewer-navigation" aria-label="切换照片"><button id="vprev">← 上一张</button><button id="vnext">下一张 →</button></nav>
  </div>
</dialog>
<audio id="bgm" loop preload="none" playsinline src="music/bgm.mp3"></audio>
</body>
</html>
