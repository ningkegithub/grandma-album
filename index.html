<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外婆的时光相册</title>
<link rel="stylesheet" href="album.css?v=20260930-save-ratio">
<script src="photos.js?v=20260930-orientation1-final" defer></script>
<script src="album.js?v=20260930-original" defer></script>
</head>
<body>
<div id="cover">
  <div class="seal">外婆</div>
  <h1>时光相册</h1>
  <div class="sub">献给我们最爱的外婆 · 黎桂华</div>
  <div class="meta">2004 — 2026</div>
  <button class="btn" id="startBtn">打开相册</button>
  <div class="credit">背景音乐 · Meditation Impromptu 03<br>Kevin MacLeod（incompetech.com）· CC BY 3.0 授权</div>
</div>
<button id="musicBtn" title="播放背景音乐" aria-label="播放背景音乐" aria-pressed="false">♫</button>
<main id="album" hidden>
  <nav id="yearToolbar" class="toolbar" aria-label="按年份看照片">
    <label class="year-picker"><span>年份</span><select id="yearSelect" aria-label="选择年份，选择后直接跳到这一年"></select></label>
    <span id="photoTotal">836 张照片</span>
  </nav>
  <p id="musicStatus" role="status"></p>
  <div id="timeline"></div>
  <footer>愿时光温柔以待<br>把每一个笑容都收好 ❤</footer>
</main>
<noscript><p>请开启浏览器的 JavaScript 后刷新，就能看到相册。</p></noscript>
<dialog id="viewer" aria-labelledby="vtitle" aria-describedby="vdesc">
  <div id="stage"><img id="vimg" alt=""><div id="imageFeedback" role="status" hidden><p id="imageStatus"></p><button id="retryImage" hidden>重新加载</button></div></div>
  <div id="vbar"><div class="when"><span id="vwhen"></span> · <span id="vtitle"></span></div><div class="what" id="vdesc"></div><div class="count" id="vcount" aria-live="polite"></div></div>
  <select id="viewerYearSelect" aria-label="切换年份，查看这一年的第一张照片"></select>
  <button class="vbtn" id="vclose" aria-label="返回相册" title="返回相册" autofocus>✕</button>
  <button class="vbtn" id="vprev" aria-label="上一张" title="上一张">‹</button>
  <button class="vbtn" id="vnext" aria-label="下一张" title="下一张">›</button>
  <button id="savePhoto">保存照片</button>
</dialog>
<dialog id="saveViewer" aria-labelledby="saveHint">
  <button id="closeSave" autofocus>‹ 返回照片</button>
  <div class="save-image-area"><img id="saveImage" alt=""><p id="saveImageStatus" role="status" hidden>原图暂时没加载出来，请返回后重试。</p></div>
  <div class="save-instructions"><p id="saveHint">长按照片，选择“保存图片”</p><p>如果没有保存选项，可用手机浏览器打开相册后再试。电脑上可右键保存图片。</p></div>
</dialog>
<audio id="bgm" loop preload="none" playsinline src="music/bgm.mp3"></audio>
</body>
</html>
