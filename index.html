<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>外婆的时光相册</title>
<style>
:root{--paper:#faf6ee;--ink:#4a3f33;--soft:#8a7a64;--line:#e7dcc6;--red:#b5462f;--gold:#c99b5f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;min-height:100dvh;}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;
  background:var(--paper);color:var(--ink);overflow-x:hidden;}
/* ---------- 封面 ---------- */
#cover{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 28px calc(40px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 90% at 50% 0%,#fffdf7 0%,var(--paper) 60%,#f3ead6 100%);}
#cover .seal{width:74px;height:74px;border:2px solid var(--red);border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--red);font-size:30px;letter-spacing:2px;margin-bottom:26px;background:#fff;box-shadow:0 8px 24px rgba(181,70,47,.12);}
#cover h1{font-size:34px;letter-spacing:6px;font-weight:600;margin-bottom:12px;}
#cover .sub{color:var(--soft);font-size:15px;letter-spacing:2px;margin-bottom:8px;}
#cover .meta{color:var(--soft);font-size:13px;margin:18px 0 34px;letter-spacing:1px;}
.btn{display:inline-block;background:var(--red);color:#fff;border:none;border-radius:999px;
  padding:15px 52px;font-size:16px;letter-spacing:3px;cursor:pointer;box-shadow:0 10px 28px rgba(181,70,47,.3);}
.btn:active{transform:scale(.97);}
.credit{margin-top:34px;font-size:11px;color:#b3a68d;letter-spacing:.5px;line-height:1.8;}
/* ---------- 时间线 ---------- */
#album{display:none;padding:26px 14px calc(60px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;}
#album.show{display:block;}
.year h2{text-align:center;margin:34px 0 16px;font-size:22px;letter-spacing:8px;color:var(--red);font-weight:600;}
.year h2 span{border-bottom:2px solid var(--gold);padding-bottom:6px;}
.year:first-child h2{margin-top:8px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(74,63,51,.07);cursor:pointer;}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.card figcaption{font-size:11px;color:var(--soft);text-align:center;padding:7px 4px;line-height:1.6;}
footer{text-align:center;color:#b3a68d;font-size:12px;padding:30px 20px calc(30px + env(safe-area-inset-bottom));line-height:2;}
/* ---------- 音乐按钮 ---------- */
#musicBtn{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:60;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:20px;display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer;}
#musicBtn.playing{animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ---------- 查看器 ---------- */
#viewer{position:fixed;inset:0;z-index:100;background:rgba(24,18,12,.96);display:none;
  touch-action:none;overscroll-behavior:contain;}
#viewer.open{display:block;}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#stage img{max-width:100vw;max-height:100dvh;object-fit:contain;will-change:transform;user-select:none;-webkit-user-drag:none;}
#vbar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;}
#vbar .when{font-size:13px;color:#f3d9a8;letter-spacing:1px;margin-bottom:4px;}
#vbar .what{font-size:16px;font-weight:600;}
#vbar .count{position:absolute;right:16px;top:14px;font-size:12px;color:#cbb;}
.vbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#vclose{right:12px;}
#vprev,#vnext{top:50%;transform:translateY(-50%);width:46px;height:46px;}
#vprev{left:8px;}#vnext{right:8px;}
#vsave{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:var(--red);color:#fff;border:none;border-radius:999px;padding:12px 34px;font-size:15px;letter-spacing:2px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;z-index:5;}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
  padding:10px 20px;border-radius:999px;font-size:13px;display:none;z-index:200;white-space:nowrap;}
</style>
</head>

var vi=0,viewer=document.getElementById('viewer'),vimg=document.getElementById('vimg'),
    stage=document.getElementById('stage');
var scale=1,tx=0,ty=0,lastTap=0;
function apply(){vimg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';}
function clamp(){
  var r=vimg.getBoundingClientRect();
  var overX=Math.max(0,(r.width-stage.clientWidth)/2),overY=Math.max(0,(r.height-stage.clientHeight)/2);
  tx=Math.max(-overX,Math.min(overX,tx));ty=Math.max(-overY,Math.min(overY,ty));apply();
}
function show(i){
  vi=(i+PHOTOS.length)%PHOTOS.length;
  var p=PHOTOS[vi];
  scale=1;tx=0;ty=0;apply();
  vimg.src=p.src;
  document.getElementById('vwhen').textContent=p.when+' · '+p.title;
  document.getElementById('vwhat').textContent=p.desc;
  document.getElementById('vcount').textContent=(vi+1)+' / '+PHOTOS.length;
}
function openViewer(i){show(i);viewer.classList.add('open');document.body.style.overflow='hidden';}
function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';}
document.querySelectorAll('.card').forEach(function(c){
  c.addEventListener('click',function(){openViewer(parseInt(c.dataset.i,10));});
});
document.getElementById('vclose').onclick=closeViewer;
document.getElementById('vprev').onclick=function(e){e.stopPropagation();show(vi-1);};
document.getElementById('vnext').onclick=function(e){e.stopPropagation();show(vi+1);};
document.addEventListener('keydown',function(e){
  if(!viewer.classList.contains('open'))return;
  if(e.key==='Escape')closeViewer();
  if(e.key==='ArrowLeft')show(vi-1);
  if(e.key==='ArrowRight')show(vi+1);
});
/* 手势:单指拖动/滑动,双指缩放,双击放大 */
var pts=new Map(),pinchD0=0,scale0=1,swipeX=null,movedFar=false;
stage.addEventListener('pointerdown',function(e){
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){swipeX=e.clientX;movedFar=false;}
  if(pts.size===2){var a=[...pts.values()];pinchD0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale0=scale;}
});
stage.addEventListener('pointermove',function(e){
  if(!pts.has(e.pointerId))return;
  var prev=pts.get(e.pointerId);
  var dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    var a=[...pts.values()];
    var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD0>0){scale=Math.max(1,Math.min(5,scale0*d/pinchD0));clamp();}
    movedFar=true;
  }else if(pts.size===1){
    if(Math.abs(e.clientX-swipeX)>12)movedFar=true;
    if(scale>1){tx+=dx;ty+=dy;clamp();}
  }
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size===0){
    var now=Date.now();
    if(!movedFar){
      if(now-lastTap<320){ /* 双击 */
        scale=scale>1?1:2.5;tx=0;ty=0;apply();
      }
      lastTap=now;
    }else if(scale===1&&swipeX!==null){
      var dx=e.clientX-swipeX;
      if(Math.abs(dx)>60)show(vi+(dx<0?1:-1));
    }
    swipeX=null;
  }
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);
/* 保存照片 */
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  setTimeout(function(){t.style.display='none';},2600);}
/* 保存照片：微信内调原生看图（长按即可保存到系统相册），其他浏览器走下载 */
function absUrl(rel){try{return new URL(rel,location.href).href;}catch(e){return rel;}}
function blobDownload(p,fname,btn){
  function direct(){var a=document.createElement('a');
    a.href=p.src;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    toast('已开始下载，长按图片也可保存到相册');}
  if(btn.disabled)return;btn.disabled=true;
  toast('正在准备照片…');
  fetch(p.src).then(function(r){if(!r.ok)throw new Error('fetch');return r.blob();}).then(function(b){
    var url=URL.createObjectURL(b),a=document.createElement('a');
    a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},5000);
    toast('照片已保存，长按图片也可存到相册');
  }).catch(function(){direct();}).then(function(){btn.disabled=false;});
}
document.getElementById('vsave').addEventListener('click',function(e){
  e.stopPropagation();
  var p=PHOTOS[vi],btn=this,fname='外婆的时光相册-'+(vi+1)+'.jpg';
  if(/MicroMessenger/i.test(navigator.userAgent)){
    var urls=PHOTOS.map(function(q){return absUrl(q.src);});
    var st={done:false};
    function openPrev(){if(st.done)return;st.done=true;
      WeixinJSBridge.invoke('imagePreview',{current:urls[vi],urls:urls});}
    if(window.WeixinJSBridge){openPrev();}
    else{document.addEventListener('WeixinJSBridgeReady',openPrev);
      setTimeout(function(){if(!st.done){st.done=true;blobDownload(p,fname,btn);}},1500);}
  }else{
    blobDownload(p,fname,btn);
  }
});
/* ---------- 背景音乐 ---------- */
(function(){
  var audio=document.getElementById('bgm'),btn=document.getElementById('musicBtn'),
      started=false,userPaused=false;
  audio.volume=0.7;
  audio.addEventListener('canplay',function(){btn.style.display='flex';});
  var src=audio.querySelector('source');
  src.addEventListener('error',function(){btn.style.display='none';});
  audio.addEventListener('play',function(){btn.classList.add('playing');btn.textContent='🎵';});
  audio.addEventListener('pause',function(){btn.classList.remove('playing');btn.textContent='🔇';});
  function tryPlay(){
    if(!started||userPaused||!audio.paused)return;
    var pr=audio.play();if(pr&&pr.catch)pr.catch(function(){});
  }
  btn.addEventListener('click',function(e){e.stopPropagation();
    if(audio.paused){userPaused=false;var pr=audio.play();if(pr&&pr.catch)pr.catch(function(){});}
    else{userPaused=true;audio.pause();}});
  document.getElementById('startBtn').addEventListener('click',function(){
    document.getElementById('cover').style.display='none';
    document.getElementById('album').classList.add('show');
    window.scrollTo(0,0);
    if(!started){started=true;userPaused=false;audio.load();tryPlay();}
  });
  ['touchend','pointerdown'].forEach(function(ev){
    document.addEventListener(ev,function(){tryPlay();},{passive:true});
  });
  document.addEventListener('WeixinJSBridgeReady',function(){tryPlay();});
})();
</script>
